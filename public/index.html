	<head>
		<meta charset="utf-8" />
		<meta
		  name="viewport"
		  content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
		/>
	
		<title>Biblioteka</title>

		
	
		<meta name="description" content="" />
	
		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="/assets/img/logo.svg" />
	
		<!-- Icons. Uncomment required icon fonts -->
		<link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
	
		<!-- Core CSS -->
		<link rel="stylesheet" href="/assets/vendor/css/core.css" />
		<link rel="stylesheet" href="/assets/vendor/css/theme-default.css" />
		<link rel="stylesheet" href="/assets/css/demo.css" />
		<link rel="stylesheet" href="/assets/vendor/css/pages/page-auth.css" />

		<!-- Vendors CSS -->

		<!-- Page CSS -->
	
	  </head>
	<body>
		<noscript>
			<strong>We're sorry but project doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
		</noscript>
		<div id="app"></div>
		
		<script>
		var app_settings = {};
        try { document.domain = 'biblioteka.kz'; } catch (e) { console.warn('document.domain ignored:', e.message); }
		
		// API Proxy - handle all /api/* requests  
		if (location.pathname.startsWith('/api/') && !window._api_loaded) {
			fetch('/api/index.php?' + new URLSearchParams({__api:1}))
				.then(r => r.text())
				.then(html => document.title = document.title || 'API')
				.then(() => { const w=document.createElement('div');w.setAttribute('api-data','');document.body.appendChild(w);w.innerHTML=html.replace(/id="app"/,'id="app" style="display:none;"');window._api_loaded=true;});
		}
		
		</script>
		
		<script src="/bundle.js"></script>

	</body>

</html>
